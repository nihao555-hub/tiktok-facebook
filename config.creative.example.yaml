# 创意叙事大片模式（template: creative）示例配置。复制为 config.yaml 用 --config 指定。
# 对标京东外卖《星球杯·黑牌》那类电影感高概念创意广告：借一个世界观演一个反转故事，
# 把卖点演成剧情高潮，再从软广丝滑转硬广。防同质化由代码兜底（和历史每条片≥N轴不同）。
#
#   python -m pipeline.run --config config.creative.example.yaml      # 跑完整出片
#   python -m pipeline.run --list-creative-axes                       # 看全部变量轴
#   python -m pipeline.creative_engine --batch 5 --brief              # 只批量产创意点子

project: "creative_demo"
template: creative           # 关键：切到创意叙事大片模式
language: zh                 # 创意片旁白语言（zh|en|th|...）

video:
  width: 1080
  height: 1920              # 9:16 竖屏
  fps: 30
  target_seconds: 50        # 创意片偏长（叙事+反转），建议 40-60s

# 要演的卖点（不口播，由"卖点视觉隐喻"轴把它演成剧情高潮）
brief:
  product_name: "京东秒送"
  selling_points:
    - "最快分钟级送达"
    - "啥都能送，万物到家"
  target_market: "全国 · 年轻人 · 618 大促"
  cta: "京东618 · 现在下单 🛒"
  product_images: []         # 有品牌/产品图可填，出图会更贴你的真货

# 创意引擎：6 轴组合 + 防同质化硬保证
creative:
  line: ""                   # 创作线 id（隔离历史，连续跑越跑越不撞款）；留空=用 project
  min_axes_different: 3      # 和历史每条片至少不同的轴数
  scene_count: 9            # 镜头数（叙事密、节奏快，建议 8-12）
  seed:                     # 复现某次随机组合（留空=每次新抽）
  lock: {}                  # 想固定风格就锁轴，如 {world: wuxia} 让世界观永远武侠、其余仍随机

# 配音：创意片建议用有"腔调"的音色（解说/说书/史诗预告）
tts:
  rate: "+6%"
  volume: "+0%"
  voice_lang: ""             # 留空=跟随 language
  voice: ""

# 字幕
subtitles:
  enabled: true
  lang_mode: zh              # 中文创意片用单中文字幕（自动走 CJK 字体）
  whisper_model: small
  font: "assets/fonts/Montserrat-Bold.ttf"
  zh_font: "WenQuanYi Zen Hei"
  font_size: 54
  max_chars: 14
  primary_color: "&H00FFFFFF"
  margin_v: 300

# 片段生成
clipgen:
  scene_count: 9
  seconds_per_scene: 5
  video_seconds: 10
  video_retries: 3
  image_retries: 2
  preserve_product: false    # 创意片更看重电影感而非 1:1 还原商品；要强约束品牌资产再开

# 平台装饰
decorate:
  bgm: ""
  bgm_volume: 0.18
  logo: ""
  progress_bar: false
  cta_sticker: true
  strip_ai_watermark: true

# A/B 多版本（同一底片换不同钩子文案/BGM 跑量）
variants:
  hooks: []
  bgms: []

# 发布
publish:
  tiktok: false
  facebook: false
  caption: "{product_name} — 618 来了 🔥 #创意广告 #脑洞"

# 一个投流视频任务的配置。复制为 config.yaml 或用 --config 指定。
# 两条业务线对应 prompts/factory_persona.md 与 prompts/product_persona.md

project: "demo"
template: product          # factory | product
language: en               # 文案/配音语言 (en|th|zh|id|vi|ms...)
                           # 注：泰语 th 请配合 TTS_MODEL=eleven_v3 + 泰文字体 Kanit-Bold.ttf

# 爆款「通用接口模版」：指导 AI 按验证过的爆款结构拍片（详见 docs/VIRAL_TEMPLATES.md）
# auto = 让 AI 从模版库自选最契合的一个；或钉死某个 id 做 A/B：
#   pas|before_after|i_tested_it|unboxing|wait_for_it|listicle|pov_story|
#   comparison|tutorial|satisfying_asmr|factory_tour|founder_direct
# 查看全部：python -m pipeline.run --list-templates
viral_template: auto

video:
  width: 1080
  height: 1920             # 9:16 竖屏 (TikTok/Reels 原生)
  fps: 30
  target_seconds: 24       # 期望成片时长

# 选题/产品信息（喂给 LLM 写脚本）
brief:
  product_name: "Adjustable Laptop Stand"
  selling_points:
    - "saves your neck & posture"
    - "folds flat, fits any bag"
    - "aluminum, holds up to 10kg"
  target_market: "US office workers / remote workers"
  cta: "Tap the cart 🛒 limited 30% off"

# AI 片段生成（每个分镜一段）。
# CLIPGEN_PROVIDER=wuyinkeji 时：gpt-image-2 出超写实图(吃 media/refs 真实素材) -> 无垠把图动起来
# CLIPGEN_PROVIDER=local 时：读取 media/clips 下的素材（无则合成占位）
clipgen:
  scene_count: 5
  seconds_per_scene: 5
  video_seconds: 10        # 在线视频生成每段时长（混剪阶段会按配音裁到精确长度）

# 配音
tts:
  rate: "+8%"              # 语速
  volume: "+0%"

# 字幕（短句逐句弹入 pop-in，白字黑描边，平台原生感）
subtitles:
  enabled: true
  whisper_model: small     # tiny|base|small|medium  （越大越准越慢）
  font: "assets/fonts/Montserrat-Bold.ttf"  # 英文用 Montserrat；泰文用 assets/fonts/Kanit-Bold.ttf
  font_size: 54            # 留空则按分辨率自适应（基准 720x1280）
  max_words: 3             # 有空格语言(英/西等)：每屏最多几个词
  max_chars: 16            # 无空格语言(泰/中/日)：每屏最多几个字
  primary_color: "&H00FFFFFF"     # 白字 + 黑描边（原生爆款字幕样式）
  margin_v: 300            # 字幕在下三分之一，避开底部 UI 安全区

# 平台原生装饰（对标 TikTok/Reels 真实形式）
decorate:
  bgm: ""                  # 留空=不加；填 media/bgm/xxx.mp3
  bgm_volume: 0.18
  logo: ""                 # 品牌水印 png，留空=不加（建议留空，原生视频不挂大 logo）
  progress_bar: false      # 顶部进度条非原生，默认关闭
  cta_sticker: true        # 左下角 TikTok 红购物按钮样式 CTA（用 brief.cta 文本）
  strip_ai_watermark: true # 裁掉 AI 视频右下角角标水印（看不出 AI）

# 批量 A/B 多版本（投流测素材）：会按下面的组合各产一条
variants:
  hooks:                   # 覆盖前 3 秒钩子文案，每个生成一版
    - "POV: your neck hurts every single day 😩"
    - "I wish I knew this 1 year ago..."
  bgms: []                 # 可放多个 bgm 路径，各生成一版

# 发布
publish:
  tiktok: false
  facebook: false
  caption: "{product_name} — link in bio 🔗 #tiktokmademebuyit #gadgets"
